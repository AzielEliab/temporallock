[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporallock"
version = "0.1.0"
description = "Append-only observation receipts with cryptographic linking — receipts, not truth claims (TemporalLock, July 2026)."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Aziel Eliab"}]
requires-python = ">=3.10"
keywords = [
    "receipts",
    "append-only",
    "hash-chain",
    "observations",
    "evidence",
    "forks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
temporallock = "temporallock.cli:main"

[project.urls]
Homepage = "https://github.com/AzielEliab/temporallock"
Download = "https://github.com/AzielEliab/temporallock/releases"
Issues = "https://github.com/AzielEliab/temporallock/issues"

[tool.setuptools.packages.find]
include = ["temporallock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
